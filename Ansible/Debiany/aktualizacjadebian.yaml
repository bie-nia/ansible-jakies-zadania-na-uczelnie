- name: Playbook do aktualizacji Debian
  hosts: serweryweb
  gather_facts: yes
  vars:
    slack_webhook: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          32393939633163303934616437663131356139313162633237383063316237333564613738323532
          6138353037656332336635306562353964353732366435650a616661356263386666336566366464
          63626431353236623061643166336133656235366632316236653564333465343862356464653736
          3234393434626235350a616636323738346630333633396639336363336232383532356364653363
          65343661343335373161333835643333653931646238306434633634616539643333363335313634
          3132303033303261333861363963376466363235343966616365

  tasks:
    - name: Zaktualizuj wszystkie pakiety do najnowszej wersji - "apt-get upgrade"
      environment:
        DEBIAN_FRONTEND: noninteractive
      apt:
        upgrade: safe
        update_cache: yes
        autoclean: true
        clean: true
        autoremove: true
        dpkg_options: 'force-confold,force-confdef'
      register: upgradeapt

    - name: Powiadomienie na Slacku
      community.general.slack:
        token: "{{ slack_webhook }}"
        username: 'Ansible na {{ inventory_hostname }}'
        msg: |
          ### StatusAktualizacjiOprogramowania ###
          ----------------------------------------
          `Server`: {{ ansible_hostname }}
          `Status`: {{ upgradeapt.stdout_lines }}
          ----------------------------------------
        channel: "#semaphoreui"
        color: good
      no_log: true
